name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="${{ github.workspace }}/android-sdk"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-7584222_latest.zip
          unzip -q commandlinetools-linux-7584222_latest.zip
          mv cmdline-tools latest
          rm -f commandlinetools-linux-*.zip

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-26" "build-tools;25.0.0" "platform-tools" "extras;android;m2repository"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "${{ github.workspace }}/local.properties"

      - name: Build
        run: |
          sed -i '/systemProp.http.proxy/d' gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -Dhttp.proxyHost= -Dhttp.proxyPort=

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: BiliClassic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
