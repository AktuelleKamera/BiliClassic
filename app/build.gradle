apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion '25.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    defaultConfig {
        applicationId "tv.biliclassic"
        minSdkVersion 1
        targetSdkVersion 29
        versionCode 5100
        versionName "0.5.1"

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', 'mips'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        preDexLibraries false
    }

    lintOptions {
        abortOnError false
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile project(':player')
    compile project(':DanmakuFlameMaster')
}

tasks.withType(JavaCompile) {
    options.incremental = false
}

task cleanBuildCache(type: Delete) {
    delete fileTree(dir: project.buildDir, include: '**/*.dex')
    delete fileTree(dir: project.buildDir, include: '**/*.class')
    delete fileTree(dir: project.buildDir, include: '**/cache/**')
}

clean.dependsOn cleanBuildCache