apply plugin: 'com.android.application'
apply plugin: 'AndResGuard'

android {
    compileSdkVersion 29
    buildToolsVersion '25.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    defaultConfig {
        applicationId "tv.biliclassic"
        minSdkVersion 1
        targetSdkVersion 29
        versionCode 5200
        versionName "0.5.2"

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', 'mips'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        preDexLibraries false
    }

    lintOptions {
        abortOnError false
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

andResGuard {
    mappingFile = null
    use7zip = false
    useSign = false
    keepRoot = false
    whiteList = [
            "R.drawable.ic_launcher",
            "R.string.app_name"
    ]
    compressFilePattern = [
            "*.png", "*.jpg", "*.jpeg", "*.gif"
    ]
}


repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile project(':player')
    compile project(':DanmakuFlameMaster')
}

tasks.withType(JavaCompile) {
    options.incremental = false
}

task cleanBuildCache(type: Delete) {
    delete fileTree(dir: project.buildDir, include: '**/*.dex')
    delete fileTree(dir: project.buildDir, include: '**/*.class')
    delete fileTree(dir: project.buildDir, include: '**/cache/**')
}

clean.dependsOn cleanBuildCache
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def sdkDir = android.sdkDirectory
def buildToolsDir = new File(sdkDir, 'build-tools/33.0.1')
def zipalignExe = new File(buildToolsDir, 'zipalign.exe')
def apksignerJar = new File(buildToolsDir, 'lib/apksigner.jar')
def javaExe = new File(System.getProperty('java.home'), 'bin/java.exe')
def resguardApk = new File(buildDir, 'outputs/apk/AndResGuard_app-release-unsigned/app-release-unsigned_unsigned.apk')
def zopfliUnsigned = new File(buildDir, 'outputs/apk/app-release-zopfli-unsigned.apk')
def zopfliAligned = new File(buildDir, 'outputs/apk/app-release-zopfli-aligned.apk')
def finalApk = project.file('app-release.apk')

task zopfliRepack(type: Exec) {
    group = 'build'
    dependsOn 'resguardRelease'
    workingDir rootProject.projectDir
    commandLine 'python', 'tools/zopfli_apk.py',
            '--input', resguardApk.absolutePath,
            '--output', zopfliUnsigned.absolutePath
}

task zopfliAlign(type: Exec) {
    group = 'build'
    dependsOn 'zopfliRepack'
    commandLine zipalignExe.absolutePath, '-f', '4',
            zopfliUnsigned.absolutePath, zopfliAligned.absolutePath
}

task zopfliSign(type: Exec) {
    group = 'build'
    dependsOn 'zopfliAlign'
    doFirst {
        if (!keystorePropsFile.exists()) {
            throw new GradleException('Missing keystore.properties')
        }
        finalApk.delete()
    }
    commandLine javaExe.absolutePath, '-jar', apksignerJar.absolutePath, 'sign',
            '--ks', rootProject.file(keystoreProps.getProperty('storeFile')).absolutePath,
            '--ks-pass', 'pass:' + keystoreProps.getProperty('storePassword'),
            '--key-pass', 'pass:' + keystoreProps.getProperty('keyPassword'),
            '--ks-key-alias', keystoreProps.getProperty('keyAlias'),
            '--v1-signing-enabled', 'true',
            '--v2-signing-enabled', 'true',
            '--v3-signing-enabled', 'true',
            '--v4-signing-enabled', 'false',
            '--out', finalApk.absolutePath, zopfliAligned.absolutePath
}

task zopfliRelease {
    group = 'build'
    description = 'Build with AndResGuard, zopfli-repack, zipalign and V1+V2+V3 sign app-release.apk.'
    dependsOn 'zopfliSign'
}
