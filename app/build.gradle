apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion '30.0.3'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_6
        targetCompatibility JavaVersion.VERSION_1_6
    }

    defaultConfig {
        applicationId "tv.biliclassic"
        minSdkVersion 1
        targetSdkVersion 28
        versionCode 4110
        versionName "0.5.0-dev5"

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        preDexLibraries false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile project(':player')
    compile project(':DanmakuFlameMaster')
}

tasks.withType(JavaCompile) {
    options.incremental = false
}

task cleanBuildCache(type: Delete) {
    delete fileTree(dir: project.buildDir, include: '**/*.dex')
    delete fileTree(dir: project.buildDir, include: '**/*.class')
    delete fileTree(dir: project.buildDir, include: '**/cache/**')
}

clean.dependsOn cleanBuildCache