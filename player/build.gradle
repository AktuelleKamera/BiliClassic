apply plugin: 'com.android.library'

android {
    compileSdkVersion 29
    buildToolsVersion '25.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    defaultConfig {
        minSdkVersion 1
        targetSdkVersion 29
    }

    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
    }
}
