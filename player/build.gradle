apply plugin: 'com.android.library'

android {
    compileSdkVersion 28
    buildToolsVersion '30.0.3'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_5
        targetCompatibility JavaVersion.VERSION_1_5
    }

    defaultConfig {
        minSdkVersion 1
        targetSdkVersion 28
    }

    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
    }
}
